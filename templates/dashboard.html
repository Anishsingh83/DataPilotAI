{% extends "dashboard_base.html" %}

{% block title %}
Dashboard | DataPilot AI
{% endblock %}

{% block content %}


                <!-- Dashboard Header -->


<header class="dashboard-top">

    <div class="header-left">

        <h1>Dashboard</h1>

        <p>
            Welcome back, <strong>Anish</strong> 👋
        </p>

    </div>

    <div class="header-right">

        <!-- Search Box -->

        <div class="search-box">

            <input
                type="text"
                placeholder="Search datasets..."
            >

        </div>

        <!-- Notification -->

        <button class="icon-btn">

            🔔

        </button>

        <!-- Profile -->

        <div class="profile">

            <div class="avatar">

                A

            </div>

            <div>

                <h4>Anish Singh</h4>

                <small>Administrator</small>

            </div>

        </div>

    </div>

</header>


                <!-- Analytics Cards -->


<section class="analytics">

    <div class="analytics-grid">

        <div class="analytics-card">

            <h3>Datasets</h3>

            <h2>24</h2>

        </div>

        <div class="analytics-card">

            <h3>Reports</h3>

            <h2>18</h2>

        </div>

        <div class="analytics-card">

            <h3>Visualizations</h3>

            <h2>46</h2>

        </div>

        <div class="analytics-card">

            <h3>Storage</h3>

            <h2>1.8 GB</h2>

        </div>

    </div>

</section>

{% endblock %}
