<div id="alertContainer">

    <div id="customAlert" class="custom-alert">

        <div class="alert-icon">

            <i id="alertIcon"
               class="fa-solid fa-circle-check">
            </i>

        </div>

        <div class="alert-content">

            <h4 id="alertTitle">
                Success
            </h4>

            <p id="alertMessage">
                Operation completed successfully.
            </p>

        </div>

        <button
            id="closeAlert"
            class="alert-close">

            <i class="fa-solid fa-xmark"></i>

        </button>

    </div>

</div>
